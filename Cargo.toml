[package]
name = "spm"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] } # Handles mapping TOML to Rust structs
toml = "0.8"                                      # Parses TOML files
reqwest = { version = "0.11", features = ["blocking"] } # Synchronous HTTP requests
flate2 = "1.0"                                    # Gzip decompression (.tar.gz)
tar = "0.4"                                       # Tarball extractor